      :root {
        color-scheme: light;
        --cream: #f8f6f1;
        --ink: #17211c;
        --green: #1f4d3a;
        --sage: #2ecf74;
        --muted: #5d6b62;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: var(--cream);
        color: var(--ink);
        font-family: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      main { width: min(560px, 100%); }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand img { width: 34px; height: 34px; border-radius: 50%; }
      .eyebrow {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 16px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.4rem, 8vw, 3.6rem);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      h1 em { color: var(--green); font-style: italic; }
      p {
        margin: 0 0 28px;
        max-width: 42ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 20px;
        border-radius: 999px;
        background: var(--green);
        color: #fff;
        font-size: 0.82rem;
        font-weight: 600;
        text-decoration: none;
      }
      .btn--ghost {
        background: transparent;
        color: var(--green);
        border: 1px solid rgba(31, 77, 58, 0.28);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        margin-top: 34px;
        padding-top: 24px;
        border-top: 1px solid rgba(23, 33, 28, 0.12);
        font-size: 0.86rem;
      }
      .links a { color: var(--green); text-decoration: none; }
      .links a:hover { text-decoration: underline; text-underline-offset: 3px; }
      @media (prefers-reduced-motion: no-preference) {
        main { animation: in 0.5s ease both; }
        @keyframes in { from { opacity: 0; transform: translateY(8px); } }
